
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            text-align: center;
        }

        h1 {
            background: #172554;
            color: white;
            padding: 20px;
            margin-bottom: 25px;
        }

        /* Image Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px #888;
        }

        /* Slideshow */
        .slideshow {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        .slideshow img {
            max-width: 85%;
            max-height: 65vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 30px;
            background: transparent;
        }

        #counter {
            color: white;
            margin-top: 12px;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 10px;
            }

            .gallery img {
                height: 140px;
            }

            .slideshow img {
                max-width: 95%;
            }
        }

        @media (max-width: 350px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>My Image Gallery</h1>

    <!-- Image Gallery -->
    <div class="gallery">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
             alt="Nature" onclick="openSlide(0)">

        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600"
             alt="Mountains" onclick="openSlide(1)">

        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
             alt="Lake" onclick="openSlide(2)">

        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"
             alt="Forest" onclick="openSlide(3)">

        <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=600"
             alt="Wildlife" onclick="openSlide(4)">

        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600"
             alt="Mountain Peaks" onclick="openSlide(5)">
    </div>

    <!-- Slideshow -->
    <div class="slideshow" id="slideshow">

        <button class="close" onclick="closeSlide()">X</button>

        <img id="slideImage" src="" alt="Selected gallery image">

        <p id="counter"></p>

        <div class="controls">
            <button onclick="changeSlide(-1)">Previous</button>
            <button onclick="toggleAutoPlay()" id="autoButton">
                Auto-play
            </button>
            <button onclick="changeSlide(1)">Next</button>
        </div>

    </div>

    <script>
        const images = document.querySelectorAll(".gallery img");

        let currentIndex = 0;
        let timer = null;

        // Open slideshow
        function openSlide(index) {
            currentIndex = index;

            document.getElementById("slideshow").style.display = "flex";

            showSlide();
        }

        // Display current image
        function showSlide() {
            document.getElementById("slideImage").src =
                images[currentIndex].src;

            document.getElementById("slideImage").alt =
                images[currentIndex].alt;

            document.getElementById("counter").textContent =
                (currentIndex + 1) + " / " + images.length;
        }

        // Move to next or previous image
        function changeSlide(step) {
            currentIndex =
                (currentIndex + step + images.length) % images.length;

            showSlide();
        }

        // Start or stop automatic slideshow
        function toggleAutoPlay() {
            const button = document.getElementById("autoButton");

            if (timer === null) {
                timer = setInterval(function () {
                    changeSlide(1);
                }, 2000);

                button.textContent = "Stop Auto-play";
            } else {
                clearInterval(timer);
                timer = null;

                button.textContent = "Auto-play";
            }
        }

        // Close slideshow
        function closeSlide() {
            document.getElementById("slideshow").style.display = "none";

            if (timer !== null) {
                clearInterval(timer);
                timer = null;
            }

            document.getElementById("autoButton").textContent =
                "Auto-play";
        }
    </script>

</body>
</html>
